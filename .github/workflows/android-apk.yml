name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "public/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar Capacitor
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Gerar projeto Android
        working-directory: android-app
        run: |
          npx cap add android
          npx cap sync android

      - name: Ícone do app (logo JNI)
        working-directory: android-app
        run: |
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            pasta=${d%%:*}; tam=${d##*:}
            dir=android/app/src/main/res/mipmap-$pasta
            mkdir -p "$dir"
            for nome in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
              convert ../public/icons/icon-512.png -resize ${tam}x${tam} "$dir/$nome"
            done
          done

      - name: Compilar APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar APK
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk Discipulado-JNI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Discipulado-JNI-${{ github.sha }}
          path: Discipulado-JNI.apk

      - name: Publicar na release "app-android-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-android-latest -y --cleanup-tag 2>/dev/null || true
          gh release create app-android-latest Discipulado-JNI.apk \
            --target "$GITHUB_SHA" \
            --title "Discipulado JNI – Android (última versão)" \
            --notes "Baixe o arquivo Discipulado-JNI.apk no celular e instale. Gerado a partir do commit ${GITHUB_SHA}."
