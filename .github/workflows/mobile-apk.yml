name: Mobile APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar tipos
        run: npm run typecheck

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compilar APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Preparar APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Discipulado-JNI.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Discipulado-JNI-${{ github.sha }}
          path: Discipulado-JNI.apk

      - name: Publicar na release "app-android-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-android-latest -y --cleanup-tag 2>/dev/null || true
          gh release create app-android-latest "$GITHUB_WORKSPACE/Discipulado-JNI.apk" \
            --target "$GITHUB_SHA" \
            --title "Discipulado JNI – Android (última versão)" \
            --notes "Aplicativo nativo do discipulado. Gerado a partir do commit ${GITHUB_SHA}."
